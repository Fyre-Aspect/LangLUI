<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div id="border-glow-card" class="border-glow-card">
    <span class="edge-light"></span>
    <div class="border-glow-inner">

      <!-- Signed-in state -->
      <div id="auth-view">
        <div class="header">
          <div class="logo">Lang<span>Lua</span></div>
          <label class="toggle-switch" title="Toggle word replacement">
            <input type="checkbox" id="toggle-active" checked>
            <div class="toggle-track"></div>
            <div class="toggle-thumb"></div>
          </label>
        </div>

        <div class="settings-row" style="display:flex; flex-direction:column; gap:8px; margin-bottom: 12px;">
          <div style="display:flex; justify-content: space-between; align-items: center;">
            <select id="lang-select" style="background:#F1F5F9; color:#1E293B; border:1px solid #CBD5E1; border-radius:6px; padding:4px 8px; font-size:12px; cursor:pointer;">
              <option value="es">🇪🇸 Spanish</option>
              <option value="fr">🇫🇷 French</option>
              <option value="hi">🇮🇳 Hindi</option>
              <option value="ja">🇯🇵 Japanese</option>
            </select>
            <span style="font-size:12px; color:#64748B;">Intensity: <strong id="intensity-lbl" style="color:#1E293B;">5</strong></span>
          </div>
          <input type="range" id="intensity-slider" min="1" max="10" step="1" value="5" class="intensity-slider">
        </div>

        <div class="mode-row">
          <span class="mode-label">🎯 Practice Mode</span>
          <label class="toggle-switch" title="Toggle Practice mode">
            <input type="checkbox" id="practice-toggle">
            <div class="toggle-track"></div>
            <div class="toggle-thumb"></div>
          </label>
        </div>
        <div class="mode-hint" id="mode-hint">Words stay English — you guess the translation</div>

        <div class="divider"></div>

        <div class="stat-row">
          <span class="stat-label">🪙 Credits</span>
          <span class="stat-value" id="credits-val">—</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">🔥 Streak</span>
          <span class="stat-value" id="streak-val">—</span>
        </div>

        <div class="divider"></div>

        <div class="stat-row">
          <span class="stat-label">History</span>
          <span class="stat-value" id="history-count">—</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Difficulty</span>
          <span class="stat-value" id="difficulty-breakdown">—</span>
        </div>

        <div class="divider"></div>

        <div class="actions">
          <button id="start-quiz-btn" class="btn btn-primary">Start Daily Quiz</button>
          <button id="export-history-btn" class="btn btn-ghost">Export History</button>
          <button id="clear-history-btn" class="btn btn-ghost">Clear History</button>
        </div>

        <div id="quiz-panel" class="quiz-panel hidden">
          <div class="quiz-header">Daily Quiz</div>
          <div id="quiz-question" class="quiz-question">Ready to practice? Tap a word to begin.</div>
          <div id="quiz-options" class="quiz-options"></div>
          <div id="quiz-feedback" class="quiz-feedback"></div>
          <div class="quiz-actions">
            <button id="close-quiz-btn" class="btn btn-ghost">Close Quiz</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
